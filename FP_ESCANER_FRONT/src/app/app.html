<app-header />

<div class="app-body">
  @if (auth.isAuthenticated()) {
    <app-sidebar />
    @if (!layout.sidebarOculto()) {
      <!-- Fondo para cerrar el sidebar al tocar fuera (solo visible en móvil). -->
      <div class="sidebar-backdrop" (click)="layout.toggle()"></div>
    }
  }
  <main class="app-main">
    <router-outlet />
  </main>
</div>

<app-footer />
