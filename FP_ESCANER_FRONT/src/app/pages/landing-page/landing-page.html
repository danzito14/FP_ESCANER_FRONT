@if (isAuthenticated() && puedeVerPanel()) {
  <div class="dash-card">
    <app-dashboard />
  </div>
} @else {
  <section class="landing">
    <div class="hero">
      <span class="hero-tag">Panel de administración</span>
      <h1>FP Escáner</h1>
      <p>Control de asistencia biométrico. Gestiona el catálogo del sistema desde un solo lugar.</p>
    </div>

    <div class="modulos-grid">
      @for (m of modulosVisibles(); track m.ruta) {
        <a class="modulo-card" [routerLink]="m.ruta">
          <span class="modulo-icono"><fa-icon [icon]="m.icono" /></span>
          <div class="modulo-info">
            <h3>{{ m.titulo }}</h3>
            <p>{{ m.descripcion }}</p>
          </div>
          <span class="modulo-arrow"><fa-icon [icon]="flecha" /></span>
        </a>
      }
    </div>
  </section>
}
