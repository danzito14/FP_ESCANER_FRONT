<form [formGroup]="form" (ngSubmit)="onSubmit()" class="crud-form">
  <div class="form-with-map">
    <div class="form-fields">
      <div class="form-field">
        <label for="nombre_dispositivo">Nombre del dispositivo</label>
        <input id="nombre_dispositivo" type="text" formControlName="nombre_dispositivo" />
        @if (form.controls.nombre_dispositivo.touched && form.controls.nombre_dispositivo.invalid) {
          <small class="error">El nombre es requerido.</small>
        }
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="tipo_dispositivo">Tipo</label>
          <select id="tipo_dispositivo" formControlName="tipo_dispositivo">
            <option value="escaner_facial">Escáner facial</option>
            <option value="huella">Huella</option>
            <option value="escaner_qr">Escáner QR</option>
          </select>
        </div>

        <div class="form-field">
          <label for="estado">Estado</label>
          <select id="estado" formControlName="estado">
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
            <option value="mantenimiento">Mantenimiento</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="ip_dispositivo">IP</label>
          <input id="ip_dispositivo" type="text" formControlName="ip_dispositivo" placeholder="192.168.1.100" />
        </div>

        <div class="form-field">
          <label for="puerto">Puerto</label>
          <input id="puerto" type="number" formControlName="puerto" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="empresa_sel">Empresa</label>
          <select id="empresa_sel" [value]="empresaSel()" (change)="onEmpresa($event)">
            <option [value]="0" disabled>Selecciona una empresa…</option>
            @for (emp of empresas(); track emp.id_empresa) {
              <option [value]="emp.id_empresa">{{ emp.nombre_empresa }}</option>
            }
          </select>
        </div>

        <div class="form-field">
          <label for="id_area">Área</label>
          <select id="id_area" formControlName="id_area" (change)="onArea()">
            <option [ngValue]="0">
              {{ empresaSel() ? 'Sin área' : 'Elige una empresa primero' }}
            </option>
            @for (area of areasFiltradas(); track area.id_area) {
              <option [ngValue]="area.id_area">{{ area.nombre_area }}</option>
            }
          </select>
        </div>

        <div class="form-field">
          <label for="fecha_instalacion">Fecha de instalación</label>
          <input id="fecha_instalacion" type="date" formControlName="fecha_instalacion" />
        </div>
      </div>

      <fieldset class="coords">
        <legend>Ubicación (punto)</legend>
        <div class="coord-row">
          <input type="number" step="any" formControlName="lat" placeholder="Latitud" />
          <input type="number" step="any" formControlName="lng" placeholder="Longitud" />
        </div>
        <p class="hint">Selecciónalo en el mapa o escríbelo. Opcional.</p>
      </fieldset>
    </div>

    <aside class="form-map">
      <app-map-picker
        mode="point"
        [wkt]="mapWkt()"
        [contexto]="areaContextoWkt()"
        (coordsChange)="onMapCoords($event)"
      />
    </aside>
  </div>

  <div class="form-actions">
    <button type="button" class="btn btn-ghost" (click)="cancel.emit()">Cancelar</button>
    <button type="submit" class="btn btn-primary">{{ isEdit() ? 'Guardar' : 'Crear' }}</button>
  </div>
</form>
