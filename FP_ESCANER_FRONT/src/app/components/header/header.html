<header class="app-header">
  @if (auth.isAuthenticated()) {
    <button class="nav-toggle" type="button" (click)="layout.toggle()" aria-label="Mostrar u ocultar menú">
      <fa-icon [icon]="iconMenu" />
    </button>
  }

  <a routerLink="/" class="brand">
    <img class="brand-logo" src="favicon.ico" alt="FP Escáner" />
    SL ASISTENCIAS
  </a>

  @if (auth.isAuthenticated()) {
    <div class="header-user">
      <span>{{ auth.currentUser()?.nombre_usuario }}</span>
      <button class="btn btn-sm" (click)="logout()">Salir</button>
    </div>
  } @else {
    <a routerLink="/login" class="btn btn-sm btn-primary">Ingresar</a>
  }
</header>
